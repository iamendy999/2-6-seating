<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2학년 6반 자리 배치 시스템 - 통합 버젼</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --save: #00b894;
            --load: #e84393;
            --aisle-bg: #dfe6e9;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
            color: #2f3640;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            width: 95%;
            max-width: 1100px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .status-msg { text-align: center; color: var(--accent); font-weight: bold; height: 20px; margin-bottom: 20px;}
        
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #eee;
        }

        /* 8열 그리드 (1,2 / 빈 / 4,5 / 빈 / 7,8) */
        .classroom {
            display: grid;
            grid-template-columns: repeat(2, 100px) 40px repeat(2, 100px) 40px repeat(2, 100px);
            gap: 15px 12px;
            justify-content: center;
            padding: 25px;
            background: #ffffff;
            border: 2px solid #e1b12c; /* 교실 바닥 느낌 */
            border-radius: 15px;
        }

        .front-board {
            grid-column: 1 / span 8;
            background: #353b48;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 15px;
        }

        .seat {
            width: 100px;
            height: 70px;
            background: #fff;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.05em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        .aisle {
            grid-row: span 6;
            background-color: var(--aisle-bg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-lr;
            color: #b2bec3;
            font-size: 0.8em;
            letter-spacing: 5px;
        }

        /* 임팩트 효과 */
        .shuffling {
            animation: shake 0.12s infinite;
            background-color: #fbc531 !important;
            border-color: #e1b12c !important;
            color: #fff;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, -1px) rotate(1deg); }
        }

        .assigned {
            background: var(--accent);
            color: white;
            border-color: #0097e6;
        }

        /* 버튼 스타일링 */
        .btn-wrapper { position: relative; overflow: hidden; }
        button, .file-label {
            display: inline-block;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            text-align: center;
            transition: opacity 0.2s;
        }
        button:disabled, .file-label.disabled { background: #ced6e0 !important; cursor: not-allowed; pointer-events: none; }
        
        .btn-load { background: var(--load); }
        .btn-run { background: var(--primary); }
        .btn-save { background: var(--save); }
        
        input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎓 2학년 6반 자리 배치 시스템</h1>
    </div>
    
    <div class="status-msg" id="statusMsg">파일을 불러와 주세요.</div>

    <div class="controls">
        <div class="btn-wrapper">
            <div class="file-label btn-load">
                📂 명단 / 저장파일 불러오기
                <input type="file" id="fileInput" accept=".txt">
            </div>
        </div>
        
        <button id="runBtn" class="btn-run" disabled>🎲 자리 배치 시작</button>
        <button id="saveBtn" class="btn-save" disabled>💾 현재 결과 저장</button>
    </div>

    <div class="classroom" id="classroom">
        <div class="front-board">칠 판 (FRONT)</div>
        <!-- 좌석 동적 생성 -->
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const runBtn = document.getElementById('runBtn');
    const saveBtn = document.getElementById('saveBtn');
    const classroom = document.getElementById('classroom');
    const statusMsg = document.getElementById('statusMsg');
    
    let loadedData = [];
    let isLoadMode = false; // true면 저장파일 복구, false면 새 명단 랜덤 섞기

    // 1. 8열 구조 빌드 (27석: 5+5+빈칸+5+4+빈칸+4+4)
    function initClassroom() {
        const elements = classroom.querySelectorAll('.seat, .aisle');
        elements.forEach(el => el.remove());

        const config = [
            { rows: 5 }, { rows: 5 }, { type: 'aisle' }, // 1,2열, 3열(빈)
            { rows: 5 }, { rows: 4 }, { type: 'aisle' }, // 4,5열, 6열(빈)
            { rows: 4 }, { rows: 4 }                    // 7,8열
        ];

        config.forEach((col, idx) => {
            if (col.type === 'aisle') {
                const aisle = document.createElement('div');
                aisle.className = 'aisle';
                aisle.innerText = '통 로';
                aisle.style.gridColumn = idx + 1;
                aisle.style.gridRow = '2 / span 6';
                classroom.appendChild(aisle);
            } else {
                for (let r = 1; r <= col.rows; r++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.style.gridColumn = idx + 1;
                    seat.style.gridRow = r + 1;
                    seat.innerText = '비어있음';
                    classroom.appendChild(seat);
                }
            }
        });
    }
    initClassroom();

    // 2. 파일 읽기 (원본 명단 vs 저장된 결과 판단)
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            const rawText = ev.target.result;
            const content = rawText.split('&')[0];
            loadedData = content.split(',')
                                .map(s => s.trim())
                                .filter(s => s !== "");

            if (loadedData.length > 0) {
                runBtn.disabled = false;
                
                // 파일 이름으로 저장파일인지 원본명단인지 유추
                if (file.name.includes("자리배치")) {
                    isLoadMode = true;
                    statusMsg.innerText = "저장된 배치 파일을 불러왔습니다. [배치 시작]을 누르면 자리가 복원됩니다.";
                    runBtn.innerText = "🔄 저장된 자리 복원하기";
                } else {
                    isLoadMode = false;
                    statusMsg.innerText = "새 명단을 불러왔습니다. [배치 시작]을 누르면 랜덤으로 자리가 섞입니다.";
                    runBtn.innerText = "🎲 랜덤 자리 배치 시작";
                }
            }
        };
        reader.readAsText(file);
    });

    // 3. 자리 배치 실행 (애니메이션 공통)
    runBtn.addEventListener('click', () => {
        runBtn.disabled = true;
        saveBtn.disabled = true;
        const seats = document.querySelectorAll('.seat');
        
        // 배치할 데이터 결정
        // isLoadMode가 true면 불러온 데이터 그대로, false면 랜덤으로 섞음
        const targetData = isLoadMode ? [...loadedData] : [...loadedData].sort(() => Math.random() - 0.5);
        
        statusMsg.innerText = "자리를 배치하는 중입니다...";
        const startTime = Date.now();
        const duration = 3000; // 3초 임팩트

        const shuffleTimer = setInterval(() => {
            const elapsed = Date.now() - startTime;
            
            seats.forEach(s => {
                s.classList.add('shuffling');
                // 섞이는 동안에는 무작위 이름 표시
                s.innerText = loadedData[Math.floor(Math.random() * loadedData.length)];
            });

            if (elapsed >= duration) {
                clearInterval(shuffleTimer);
                
                seats.forEach((seat, i) => {
                    seat.classList.remove('shuffling');
                    if (targetData[i]) {
                        seat.innerText = targetData[i];
                        seat.classList.add('assigned');
                    } else {
                        seat.innerText = "-";
                        seat.classList.remove('assigned');
                    }
                });
                
                statusMsg.innerText = "자리 배치가 완료되었습니다!";
                runBtn.disabled = false;
                saveBtn.disabled = false;
                
                // 한 번 배치 후에는 무조건 랜덤 섞기 모드로 전환 (실수 방지)
                isLoadMode = false; 
                runBtn.innerText = "🎲 랜덤 자리 배치 시작";
            }
        }, 80);
    });

    // 4. 현재 결과 저장
    saveBtn.addEventListener('click', () => {
        const seats = document.querySelectorAll('.seat');
        const names = Array.from(seats).map(s => s.innerText);
        // 빈 자리(-)는 그대로 저장하되, 나중에 파싱할 때 문제없게 처리
        const content = names.join(',') + ',&';
        
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        // 파일명에 '자리배치'를 넣어 나중에 불러올 때 판단 기준으로 사용
        a.download = `${dateStr}_2-6_자리배치.txt`; 
        a.click();
        URL.revokeObjectURL(url);
        
        statusMsg.innerText = "현재 배치가 파일로 저장되었습니다.";
    });
</script>

</body>
</html>
