<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 6반 자리 배치 시스템 - 정식 버전</title>
    <style>
        :root {
            --primary: #2d3436; --accent: #0984e3; --save: #00b894;
            --load: #e84393; --view: #636e72; --aisle-bg: #dfe6e9;
        }

        body {
            font-family: 'Pretendard', sans-serif; background-color: #f5f6fa;
            display: flex; flex-direction: column; align-items: center; padding: 30px; margin: 0;
        }

        .container {
            background: white; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 95%; max-width: 1100px;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .status-msg { text-align: center; color: var(--accent); font-weight: bold; height: 24px; margin-bottom: 20px; }
        
        /* 컨트롤바 레이아웃 수정: 버튼들이 겹치지 않게 명확히 분리 */
        .controls {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 15px;
            margin-bottom: 30px; padding: 20px; background: #f8f9fa; 
            border-radius: 12px; border: 1px solid #eee; align-items: center;
        }

        .btn-wrapper { position: relative; width: 180px; height: 50px; }
        
        /* 파일 입력창이 버튼 영역 안에서만 작동하도록 제한 */
        input[type="file"] { 
            position: absolute; left: 0; top: 0; width: 100%; height: 100%; 
            opacity: 0; cursor: pointer; z-index: 10;
        }

        .avoid-check {
            display: flex; align-items: center; gap: 8px; font-weight: bold;
            color: #d63031; cursor: pointer; padding: 10px; background: #fff;
            border-radius: 8px; border: 1px solid #fab1a0;
        }

        /* 8열 그리드 레이아웃 */
        .classroom {
            display: grid;
            grid-template-columns: repeat(2, 100px) 40px repeat(2, 100px) 40px repeat(2, 100px);
            gap: 15px 12px; justify-content: center; padding: 25px;
            background: #ffffff; border: 3px solid #e1b12c; border-radius: 15px;
        }

        .front-board {
            grid-column: 1 / span 8; background: #353b48; color: white;
            text-align: center; padding: 15px; border-radius: 8px;
            font-weight: bold; margin-bottom: 20px; letter-spacing: 20px; font-size: 1.2rem;
        }

        .seat {
            width: 100px; height: 75px; background: #fdfdfd; border: 2px solid #dcdde1;
            border-radius: 10px; display: flex; justify-content: center;
            align-items: center; font-weight: 800; font-size: 1.1rem;
        }

        .aisle {
            grid-row: span 6; background-color: var(--aisle-bg); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-lr; color: #7f8c8d; font-size: 0.85rem; font-weight: bold;
        }

        .shuffling {
            animation: shake 0.1s infinite; background-color: #fbc531 !important; color: white !important;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(1px, 1px); }
        }

        .assigned { background: var(--accent); color: white; border-color: #0097e6; }

        button, .file-label {
            width: 100%; height: 100%; border: none; border-radius: 10px;
            color: white; font-weight: bold; cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* 버튼 크기 고정 */
        .action-btn { width: auto; padding: 0 20px; height: 50px; }

        .btn-load { background: var(--load); }
        .btn-view { background: var(--view); }
        .btn-run { background: var(--primary); }
        .btn-save { background: var(--save); }
        button:disabled { background: #ced6e0 !important; cursor: not-allowed; }

        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; }
        #listModal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 20px; z-index: 1000; width: 350px;
        }
        .name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .name-item { padding: 8px; background: #f1f2f6; border-radius: 6px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>🎓 2학년 6반 자리 배치 시스템</h1></div>
    <div class="status-msg" id="statusMsg">학생 명단 파일을 불러와 주세요.</div>
    
    <div class="controls">
        <div class="btn-wrapper">
            <div class="file-label btn-load">📂 파일 불러오기</div>
            <input type="file" id="fileInput" accept=".txt">
        </div>
        
        <button id="viewBtn" class="action-btn btn-view" disabled>📋 명단 확인</button>
        
        <label class="avoid-check">
            <input type="checkbox" id="avoidSameSeat"> 이전 자리 피하기
        </label>

        <button id="runBtn" class="action-btn btn-run" disabled>🎲 랜덤 자리 배치 시작</button>
        <button id="saveBtn" class="action-btn btn-save" disabled>💾 현재 결과 저장</button>
    </div>

    <div class="classroom" id="classroom">
        <div class="front-board">칠 판 (FRONT)</div>
    </div>
</div>

<div id="modalOverlay"></div>
<div id="listModal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold; font-size:1.2rem;">학생 명단 (<span id="nameCount">0</span>명)</span>
        <span id="closeModal" style="cursor:pointer; font-size:1.5rem;">&times;</span>
    </div>
    <div id="nameListArea" class="name-grid"></div>
</div>

<script>
    const fileInput = document.getElementById('fileInput'), runBtn = document.getElementById('runBtn'),
          saveBtn = document.getElementById('saveBtn'), viewBtn = document.getElementById('viewBtn'),
          classroom = document.getElementById('classroom'), statusMsg = document.getElementById('statusMsg'),
          avoidSameSeat = document.getElementById('avoidSameSeat'),
          listModal = document.getElementById('listModal'), modalOverlay = document.getElementById('modalOverlay'),
          nameListArea = document.getElementById('nameListArea'), nameCount = document.getElementById('nameCount'),
          closeModal = document.getElementById('closeModal');

    let studentNames = [];     // 순수 학생 이름 목록
    let previousData = [];     // 파일을 불러왔을 때의 초기 상태

    function initClassroom() {
        classroom.querySelectorAll('.seat, .aisle').forEach(el => el.remove());
        const config = [{rows:5},{rows:5},{type:'aisle'},{rows:5},{rows:4},{type:'aisle'},{rows:4},{rows:4}];
        config.forEach((col, idx) => {
            if (col.type === 'aisle') {
                const aisle = document.createElement('div'); aisle.className = 'aisle'; aisle.innerText = '통 로';
                aisle.style.gridColumn = idx + 1; aisle.style.gridRow = '2 / span 6'; classroom.appendChild(aisle);
            } else {
                for (let r = 1; r <= col.rows; r++) {
                    const seat = document.createElement('div'); seat.className = 'seat';
                    seat.style.gridColumn = idx + 1; seat.style.gridRow = r + 1; seat.innerText = '빈자리';
                    classroom.appendChild(seat);
                }
            }
        });
    }
    initClassroom();

    // 즉시 표시 함수
    function displayNames(data) {
        const seats = document.querySelectorAll('.seat');
        seats.forEach((seat, i) => {
            if (data[i] && data[i] !== "-" && data[i] !== "빈자리") { 
                seat.innerText = data[i]; seat.classList.add('assigned'); 
            } else { 
                seat.innerText = "-"; seat.classList.remove('assigned'); 
            }
        });
    }

    // 1. 파일 불러오기 이벤트 (독립적으로 작동)
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            const content = ev.target.result.split('&')[0];
            const parsedData = content.split(',').map(s => s.trim()).filter(s => s !== "");
            
            previousData = [...parsedData]; // 비교용 기준 데이터 저장
            studentNames = parsedData.filter(s => s !== "-");

            if (studentNames.length > 0) {
                runBtn.disabled = false; viewBtn.disabled = false;
                displayNames(parsedData); 
                statusMsg.innerText = `✅ ${studentNames.length}명의 데이터를 불러왔습니다.`;
                fileInput.value = ""; // 같은 파일을 다시 불러올 수 있도록 리셋
            }
        };
        reader.readAsText(file);
    });

    // 2. 스마트 셔플 (중복 체크)
    function getSmartShuffle() {
        let attempts = 0;
        let shuffled = [];
        const prevOnlyNames = previousData; // 전체 좌석 형태 유지

        while (attempts < 200) {
            shuffled = [...studentNames].sort(() => Math.random() - 0.5);
            if (!avoidSameSeat.checked) return shuffled;

            let isOverlapped = false;
            for (let i = 0; i < shuffled.length; i++) {
                if (shuffled[i] === prevOnlyNames[i]) {
                    isOverlapped = true;
                    break;
                }
            }
            if (!isOverlapped) return shuffled;
            attempts++;
        }
        return shuffled;
    }

    // 3. 자리 배치 시작 버튼 이벤트
    runBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // 이벤트 전파 방지
        runBtn.disabled = true; saveBtn.disabled = true; viewBtn.disabled = true;
        
        const seats = document.querySelectorAll('.seat');
        const targetNames = getSmartShuffle();
        
        statusMsg.innerText = "⚡ 자리를 섞는 중입니다...";
        const startTime = Date.now();

        const shuffleTimer = setInterval(() => {
            seats.forEach(s => {
                s.classList.add('shuffling'); s.classList.remove('assigned');
                s.innerText = studentNames[Math.floor(Math.random() * studentNames.length)];
            });

            if (Date.now() - startTime >= 3000) {
                clearInterval(shuffleTimer);
                seats.forEach((seat, i) => {
                    seat.classList.remove('shuffling');
                    if (targetNames[i]) { seat.innerText = targetNames[i]; seat.classList.add('assigned'); }
                    else { seat.innerText = "-"; }
                });
                statusMsg.innerText = "🎊 배치가 완료되었습니다!";
                runBtn.disabled = false; saveBtn.disabled = false; viewBtn.disabled = false;
            }
        }, 80);
    });

    // 기타 모달 및 저장 기능
    viewBtn.addEventListener('click', () => {
        nameListArea.innerHTML = ""; nameCount.innerText = studentNames.length;
        studentNames.forEach((name, i) => {
            const item = document.createElement('div'); item.className = 'name-item'; item.innerText = `${i+1}. ${name}`;
            nameListArea.appendChild(item);
        });
        listModal.style.display = 'block'; modalOverlay.style.display = 'block';
    });
    [closeModal, modalOverlay].forEach(el => el.addEventListener('click', () => {
        listModal.style.display = 'none'; modalOverlay.style.display = 'none';
    }));
    saveBtn.addEventListener('click', () => {
        const content = Array.from(document.querySelectorAll('.seat')).map(s => s.innerText).join(',') + ',&';
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${new Date().toISOString().split('T')[0]}_2-6_자리배치.txt`;
        a.click();
    });
</script>
</body>
</html>
